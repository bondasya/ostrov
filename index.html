<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one column of "blocks" on a bright sky — plank cards with grass tops, stone buttons, hotbar tabs. Single bright look. */
:root{
  --sky:#7fd0ff; --sky2:#c4ecff;
  --plank:#e3b26c; --plank-d:#b9843f; --plank-line:#c9954f;
  --grass:#62c640; --grass-d:#3b8f24; --dirt:#8a5a2c;
  --stone:#d4d4d4; --stone-hi:#f2f2f2; --stone-lo:#8b8b8b;
  --ink:#24160a; --muted:#5a3a17;
  --obs:#2a2440; --gold:#ffd83d; --gold-d:#c99a0c; --dia:#3ee0d0; --red:#e5483f; --red-d:#9e221c; --em:#36d36b; --em-d:#1d8a40;
  --pixel:"Press Start 2P","Courier New",monospace;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --word:"Rubik",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:17px;font-weight:700;line-height:1.5;
  background-color:var(--sky);
  background-image:
    linear-gradient(var(--sky2),var(--sky) 420px),
    linear-gradient(transparent calc(100% - 28px),var(--grass) 0);
  background-attachment:fixed}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 56px}
h1,h2,h3{font-family:var(--pixel);font-weight:400;margin:0;line-height:1.35;text-wrap:balance}
h1{font-size:1.05rem;color:#fff;text-shadow:3px 3px 0 #2b5c8a}
h2{font-size:.95rem}
h3{font-size:.8rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.92rem}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sky);padding-block:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top h1{flex:1 1 auto;min-width:0}
.wallet{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--obs);color:#fff;padding:6px 10px;font-family:var(--pixel);font-size:.72rem;font-variant-numeric:tabular-nums;box-shadow:inset -3px -3px 0 #120f1f,inset 3px 3px 0 #4a4170}
.gem{width:18px;height:18px;flex:none;display:inline-block}
/* hotbar tabs */
.tabs{display:flex;gap:4px;margin-block:8px 14px;overflow-x:auto;background:#3a3a3a;padding:4px;box-shadow:inset 0 0 0 3px #1f1f1f}
.tab{background:#6b6b6b;color:#fff;padding:10px 12px;font-family:var(--pixel);font-size:.62rem;white-space:nowrap;box-shadow:inset -3px -3px 0 #4a4a4a,inset 3px 3px 0 #8f8f8f;text-shadow:2px 2px 0 #333}
.tab[aria-selected="true"]{background:#fff;color:var(--ink);text-shadow:none;box-shadow:inset 0 0 0 4px var(--gold)}
/* blocks */
.grid{display:grid;gap:16px}
.card{position:relative;background:var(--plank);padding:16px;display:grid;gap:12px;min-width:0;
  background-image:repeating-linear-gradient(180deg,transparent 0 30px,var(--plank-line) 30px 33px);
  box-shadow:inset -4px -4px 0 var(--plank-d),inset 4px 4px 0 #f3cd8f,0 6px 0 rgba(0,0,0,.18)}
.card.block{border-top:14px solid var(--grass);padding-top:18px;
  background-image:linear-gradient(90deg,var(--grass-d) 0 8px,transparent 8px 16px,var(--grass-d) 16px 20px,transparent 20px 34px,var(--grass-d) 34px 40px,transparent 40px),
  repeating-linear-gradient(180deg,transparent 0 30px,var(--plank-line) 30px 33px);
  background-size:48px 6px,auto;background-repeat:repeat-x,repeat;background-position:0 0,0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* buttons: bevelled blocks */
.btn{background:var(--grass);color:#0f2a06;font-weight:900;padding:12px 16px;box-shadow:inset -4px -4px 0 var(--grass-d),inset 4px 4px 0 #9be27c}
.btn:active{box-shadow:inset 4px 4px 0 var(--grass-d)}
.btn.alt{background:var(--stone);color:var(--ink);box-shadow:inset -4px -4px 0 var(--stone-lo),inset 4px 4px 0 var(--stone-hi)}
.btn.gold{background:var(--gold);color:#3b2a00;box-shadow:inset -4px -4px 0 var(--gold-d),inset 4px 4px 0 #fff3a8}
.btn:disabled{filter:grayscale(.7);opacity:.6;cursor:not-allowed}
.tasks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.task{display:flex;align-items:center;gap:10px;background:var(--stone);color:var(--ink);padding:12px;text-align:left;min-height:60px;box-shadow:inset -4px -4px 0 var(--stone-lo),inset 4px 4px 0 var(--stone-hi)}
.task .box{width:28px;height:28px;background:#fff;box-shadow:inset 0 0 0 3px #555;flex:none;display:grid;place-items:center;font-weight:900}
.task[data-task="abc"],.task[data-task="cartoon"]{grid-column:span 1}
.task.done{background:var(--em);box-shadow:inset -4px -4px 0 var(--em-d),inset 4px 4px 0 #8af0ab}
.task.done .box{background:#fff;color:var(--em-d)}
.task .t{display:grid;min-width:0}
.task .t b{font-size:1rem}
.task .t span{font-size:.85rem;color:#3d3d3d}
.task.done .t span{color:#0f3d1d}
/* XP bar */
.bar{height:16px;background:#2b2b2b;position:relative;box-shadow:inset 0 0 0 3px #111}
.bar i{position:absolute;inset:3px auto 3px 3px;max-width:calc(100% - 6px);background:linear-gradient(#b6ff5a,#5fd11e)}
.quests{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.quest{background:var(--stone);color:var(--ink);padding:14px;text-align:left;display:grid;gap:6px;box-shadow:inset -4px -4px 0 var(--stone-lo),inset 4px 4px 0 var(--stone-hi)}
.quest b{font-family:var(--pixel);font-size:.72rem;line-height:1.5}
.quest .muted{color:#3d3d3d}
.quest:hover:not(:disabled){background:#fff}
.quest:disabled{opacity:.55;cursor:not-allowed}
/* quiz */
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.prompt{font-size:1.4rem;font-weight:900;text-align:center;padding:8px 0}
.prompt .big{font-family:var(--word);font-weight:800;font-size:2.6rem;display:block;color:#fff;text-shadow:3px 3px 0 var(--dirt)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{background:var(--stone);color:var(--ink);padding:14px 8px;font-family:var(--word);font-size:1.3rem;font-weight:700;min-height:62px;box-shadow:inset -4px -4px 0 var(--stone-lo),inset 4px 4px 0 var(--stone-hi)}
.opt:hover:not(:disabled){background:#fff}
.opt.ok{background:var(--em);box-shadow:inset -4px -4px 0 var(--em-d),inset 4px 4px 0 #8af0ab}
.opt.bad{background:var(--red);color:#fff;box-shadow:inset -4px -4px 0 var(--red-d),inset 4px 4px 0 #ff8e87}
.speak{background:var(--dia);color:#063b36;padding:14px 22px;font-weight:900;font-size:1.1rem;box-shadow:inset -4px -4px 0 #1c9f93,inset 4px 4px 0 #a6fff6}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:54px}
.slot,.tile{width:48px;height:52px;display:grid;place-items:center;font-family:var(--word);font-weight:800;font-size:1.7rem}
.slot{background:rgba(0,0,0,.15);box-shadow:inset 0 0 0 3px var(--plank-d)}
.slot.f{background:#fff}
.tile{background:var(--gold);color:#3b2a00;box-shadow:inset -4px -4px 0 var(--gold-d),inset 4px 4px 0 #fff3a8}
.tile:disabled{opacity:.25}
.scene{width:100%;max-width:720px;justify-self:center;box-shadow:inset 0 0 0 4px #3a3a3a,0 6px 0 rgba(0,0,0,.18);padding:4px;background:#3a3a3a}
.scene canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.sums{display:grid;gap:10px}
.sum{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.55);padding:12px;box-shadow:inset 0 0 0 3px var(--plank-d)}
.sum .dot{width:18px;height:18px;flex:none;margin-top:4px;background:var(--stone-lo)}
.sum.good .dot{background:var(--em)} .sum.mid .dot{background:var(--gold)} .sum.bad .dot{background:var(--red)}
.sum b{display:block;font-size:1.05rem} .sum>div{display:grid;gap:2px;min-width:0}
.week{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.week i{font-style:normal;font-size:.8rem;font-weight:900;width:34px;height:30px;display:grid;place-items:center;background:#d9c19a;color:#6b4c25}
.week i.full{background:var(--em);color:#0f3d1d} .week i.part{background:var(--gold);color:#3b2a00}
details.more>summary{cursor:pointer;font-family:var(--pixel);font-size:.75rem;line-height:1.6;list-style-position:inside}
details.more .sub{display:grid;gap:10px;margin-top:12px}
.wtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wtile{display:grid;gap:4px;padding:12px;text-align:left;color:var(--ink)}
.wtile b{font-family:var(--pixel);font-size:.72rem;line-height:1.5} .wtile span{font-size:.85rem}
.wtile.g{background:var(--em);box-shadow:inset -4px -4px 0 var(--em-d),inset 4px 4px 0 #8af0ab}
.wtile.r{background:var(--red);color:#fff;box-shadow:inset -4px -4px 0 var(--red-d),inset 4px 4px 0 #ff8e87}
.wtile.s{background:var(--stone);box-shadow:inset -4px -4px 0 var(--stone-lo),inset 4px 4px 0 var(--stone-hi)}
.wtile.on{outline:4px solid var(--gold);outline-offset:2px}
@media (max-width:460px){.wtiles{grid-template-columns:1fr}}
.hintline{text-align:center;font-family:var(--word);font-weight:800;font-size:1.8rem;letter-spacing:.08em;color:var(--ink)}
.hpart{display:inline-flex;align-items:center;gap:4px}
.pre{font-family:var(--word);font-weight:800;font-size:1.6rem;background:var(--gold);padding:8px 12px;box-shadow:inset -3px -3px 0 var(--gold-d)}
.lr-en{font-size:2.6rem;color:#11702f}.lr-en.dim{color:var(--plank-d)}
.progtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#3a3a3a;padding:4px;box-shadow:inset 0 0 0 3px #1f1f1f}
.progtab{background:#6b6b6b;color:#fff;padding:12px;font-family:var(--pixel);font-size:.75rem;box-shadow:inset -3px -3px 0 #4a4a4a,inset 3px 3px 0 #8f8f8f}
.progtab.on{background:var(--gold);color:#3b2a00;box-shadow:inset -3px -3px 0 var(--gold-d),inset 3px 3px 0 #fff3a8}
.typed{font-family:var(--word);font-size:1.5rem;font-weight:700;width:min(320px,100%);text-align:center;padding:12px}
.typed.ok{background:#c9f7d8;box-shadow:inset 0 0 0 3px var(--em-d)} .typed.bad{background:#ffd9d6;box-shadow:inset 0 0 0 3px var(--red-d)}
.qbody{display:grid;gap:14px}
.feedback{text-align:center;font-weight:900;font-size:1.15rem;min-height:1.5em}
.feedback.ok{color:#11702f} .feedback.bad{color:var(--red-d)}
/* words */
.words{display:flex;flex-wrap:wrap;gap:6px}
.w{padding:6px 10px;background:var(--stone);color:var(--ink);font-family:var(--word);font-weight:700;font-size:.95rem;box-shadow:inset -3px -3px 0 var(--stone-lo),inset 3px 3px 0 var(--stone-hi)}
.w .muted{color:#4a4a4a;font-family:var(--body)}
.w.m{background:var(--em);box-shadow:inset -3px -3px 0 var(--em-d),inset 3px 3px 0 #8af0ab}
.w.m .muted{color:#0f3d1d}
.w.weak{background:var(--red);color:#fff;box-shadow:inset -3px -3px 0 var(--red-d),inset 3px 3px 0 #ff8e87}
.w.weak .muted{color:#ffe1de}
.w.new{opacity:.75}
.card-w{display:inline-grid;text-align:center;min-width:92px;padding:10px 12px;font-size:1.05rem}
.card-w .ru{display:none;font-family:var(--body);font-weight:800;font-size:.85rem;margin-top:2px}
.card-w.wait{outline:3px dashed var(--gold);outline-offset:-3px}
.card-w.open .ru{display:block}
.card-w.open{background:#fff8d6}
.card-w.m.open,.card-w.weak.open{background:#fff8d6;color:var(--ink)}
.card-w.weak.open .ru,.card-w.m.open .ru{color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;background:var(--stone);vertical-align:-1px;box-shadow:inset 0 0 0 2px var(--stone-lo)}
.legend .lm::before{background:var(--em);box-shadow:inset 0 0 0 2px var(--em-d)} .legend .lw::before{background:var(--red);box-shadow:inset 0 0 0 2px var(--red-d)}
/* shop / bank */
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.item{background:var(--stone);padding:14px;display:grid;gap:8px;box-shadow:inset -4px -4px 0 var(--stone-lo),inset 4px 4px 0 var(--stone-hi)}
.price{font-family:var(--pixel);font-size:.85rem;color:#7a5600;display:flex;align-items:center;gap:6px}
input,select{font:inherit;background:#fff;color:var(--ink);border:0;box-shadow:inset 0 0 0 3px var(--plank-d);padding:9px;min-width:0}
.tbl{overflow-x:auto;background:rgba(255,255,255,.45);box-shadow:inset 0 0 0 3px var(--plank-d)}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:2px solid var(--plank-line);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:900;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
.y{color:#11702f;font-weight:900} .n{color:#a9814e}
.lesson{color:#b4310f;font-weight:900}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat div{background:var(--obs);color:#fff;padding:10px 12px;box-shadow:inset -3px -3px 0 #120f1f,inset 3px 3px 0 #4a4170}
.stat .muted{color:#cfc6ff}
.stat b{font-family:var(--pixel);font-size:1rem;display:block;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(36px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--obs);color:var(--gold);font-weight:900;padding:12px 16px;z-index:20;max-width:calc(100% - 32px);box-shadow:inset 0 0 0 3px var(--gold),0 6px 0 rgba(0,0,0,.25)}
.status{font-size:.85rem;color:#1d4a6b;margin-top:12px}
@media (min-width:740px){
  body{font-size:19px}
  h1{font-size:1.3rem} h2{font-size:1.1rem} h3{font-size:.9rem}
  .tab{font-size:.75rem;padding:14px 16px;flex:1 1 auto}
  .tasks{grid-template-columns:repeat(3,minmax(0,1fr))}
  .task{min-height:76px}
  .prompt{font-size:1.7rem} .prompt .big{font-size:3.4rem}
  .opt{font-size:1.6rem;min-height:84px}
  .typed{font-size:1.9rem;width:min(460px,100%)}
  .btn{padding:14px 22px;font-size:1.1rem}
  .card-w{font-size:1.25rem;min-width:120px;padding:14px 16px}
  .chip{font-size:.85rem;padding:8px 12px}
  .small{font-size:1rem} .task .t b{font-size:1.15rem} .task .t span{font-size:.95rem}
  .quiz-card{min-height:calc(100vh - 240px);display:flex;flex-direction:column;gap:18px}
  .quiz-card .qbody{margin-block:auto}
  .quiz-card .opts{max-width:900px;width:100%;justify-self:center}
}
@media (max-width:460px){.tasks{grid-template-columns:1fr}.prompt .big{font-size:2.1rem}h1{font-size:.9rem}}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s steps(4)}@keyframes pop{0%{transform:translateX(-50%) scale(.85)}100%{transform:translateX(-50%) scale(1)}}}
</style>

 {id:6,pages:"стр. 9–11",title:"O",letters:["o"],words:[["pot","кастрюля"],["cop","полицейский"],["cot","детская кроватка"],["hot","горячий"],["hippo","бегемот"],["no","нет"],["tomato","помидор"],["potato","картошка"]]},
 {id:7,pages:"стр. 12–13",title:"S, SP, ST",letters:["s","sp","st"],words:[["sit","сидеть"],["spit","плеваться"],["split","расколоться"],["fast","быстрый"],["mast","мачта"],["miss","скучать"],["spot","пятно"],["stop","стоп"]]},
 {id:8,pages:"стр. 14–16",title:"D, G",letters:["d","g"],words:[["dog","собака"],["frog","лягушка"],["bog","болото"],["dig","копать"],["fog","туман"],["band","музыкальная группа"],["sand","песок"],["stand","стоять"]]},

// ---------- Dates ----------
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dkey(new Date());
const parseKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
function mondayKey(d){const x=new Date(d);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return dkey(x)}
const WD=["вс","пн","вт","ср","чт","пт","сб"];
const isLesson=k=>{const w=parseKey(k).getDay();return w===2||w===4};

function day(k=today()){S.days[k]=S.days[k]||{t:{},q:[],earned:0,bonus:false};return S.days[k]}
function dayFull(d){return d&&DAILY.every(([id])=>d.t[id])&&d.q.length>0}
function streak(){let n=0;const d=new Date();if(!dayFull(S.days[dkey(d)]))d.setDate(d.getDate()-1);
  while(dayFull(S.days[dkey(d)])){n++;d.setDate(d.getDate()-1)}return n}
function earn(n,why){S.coins+=n;S.totalEarned=(S.totalEarned||0)+n;day().earned+=n;toast(`+${n} алмазов · ${why}`)}

function applyInterest(){ // 10% weekly on bank balance, once per new week
  const mk=mondayKey(new Date()); if(!S.bankWeek){S.bankWeek=mk;return false}
  if(S.bankWeek===mk) return false;
  const weeks=Math.max(1,Math.round((parseKey(mk)-parseKey(S.bankWeek))/(7*864e5)));
  let gain=0; for(let i=0;i<weeks;i++){const g=Math.floor(S.bank*0.10);S.bank+=g;gain+=g}
  S.bankWeek=mk; if(gain>0) setTimeout(()=>toast(`Банк начислил ${gain} алмазов процентов!`),600);
  return true;
}
function checkDayBonus(){
  const d=day(); if(d.bonus||!dayFull(d)) return;
  d.bonus=true; const st=streak(); const extra=Math.min(PRICE.streakMax,(st-1)*PRICE.streakStep);
  earn(PRICE.dayDone+Math.max(0,extra),`план дня выполнен${st>1?`, серия ${st}`:""}`);
}

let saveT=null;
function save(){
  lsSet(lsKey(),JSON.stringify(S));
  if(!ACC) return;
  clearTimeout(saveT); saveT=setTimeout(pushSave,1500);

function pushSave(){
  if(!ACC) return;
  try{fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},keepalive:true,
    body:JSON.stringify({code:ACC.code,device:DEV,app:APP,progress:JSON.stringify(S)})})
    .then(r=>r.json()).then(r=>{if(r&&r.ok)setStatus("Сохранено · код "+ACC.code);else if(r&&["expired","blocked","device"].includes(r.error))gate(r,ACC.code);else setStatus("Не удалось сохранить, попробую ещё раз")})
    .catch(()=>setStatus("Нет интернета: прогресс сохранится, когда связь появится"))}catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&ACC){clearTimeout(saveT);pushSave()}});

let curA=null;
function clip(t){return AUDIO[String(t).toLowerCase().trim()]}
function playClip(t){const a=clip(t);if(!a)return null;try{if(window.speechSynthesis)speechSynthesis.cancel();if(curA)curA.pause();curA=new Audio(a);const pr=curA.play();if(pr&&pr.catch)pr.catch(()=>{});return curA}catch(e){return null}}
function say(t){if(playClip(t))return;if(!canSpeak())return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:"en-GB";if(voice)u.voice=voice;u.rate=.8;speechSynthesis.speak(u)}catch(e){}}

// ---------- Helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const gem='<svg class="gem"><use href="#gem"/></svg>';
let toastT; function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200)}
function wstat(w){return S.words[w]||{ok:0,bad:0,last:null}}
function streakOf(s){return s.streak!=null?s.streak:(s.last?(s.bad?(s.ok>=s.bad+2?2:1):s.ok):0)}
function mastered(w){return streakOf(wstat(w))>=2}
function weak(w){return wstat(w).last===false}
function mark(w,ok,typed){const s={...wstat(w)};s.seen=Date.now();const st=streakOf(s);if(ok){s.ok++;s.streak=st+1;if(typed)s.typed=(s.typed||0)+1}else{s.bad++;s.streak=0}s.last=ok;S.words[w]=s}

// ---------- Render ----------
let tab="today", quiz=null;
function renderTop(){$("#coins").textContent=S.coins;$("#bankTop").textContent=S.bank;$("#streakTop").textContent=streak()}
function render(){renderTop();document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const v=$("#view"); v.innerHTML=({today:vToday,quests:vQuests,words:vWords,shop:vShop,parent:vParent}[tab])(); bind(v)}

function vToday(){
  const d=day(), done=DAILY.filter(([id])=>d.t[id]).length, k=today(), wd=parseKey(k).getDay();
  const next=wd===2||wd===4?"Сегодня занятие! Перед уроком пройди «Охоту на ошибки».":
    `Следующее занятие: ${wd<2||wd===0?"вторник":wd<4?"четверг":"вторник"}.`;
  return `<div class="grid">
  <section class="card block">
    <div class="row" style="justify-content:space-between"><h2>План дня</h2><span class="muted small">${WD[wd]}, ${parseKey(k).toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}</span></div>
    ${examDue()?`<p class="small" style="font-weight:900;color:#b4310f">Пора на экзамен с мамой: прочитай ей 10 слов вслух и получи до ${10*PRICE.examWord+PRICE.examBonus} алмазов!</p>`:""}

const SC={W:96,H:40,hits:0,phase:"mine",t0:0,parts:[],gem:null,last:0};
function px(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}
function drawScene(now){
  const cv=document.getElementById("scene"); if(!cv) return;
  const c=cv.getContext("2d"); c.setTransform(4,0,0,4,0,0); c.imageSmoothingEnabled=false;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  // sky + clouds
  px(c,0,0,96,40,"#9bdcff"); px(c,8,5,12,3,"#fff"); px(c,10,3,7,2,"#fff"); px(c,74,7,14,3,"#fff"); px(c,77,5,7,2,"#fff");
  // ground
  px(c,0,30,96,10,"#8a5a2c"); px(c,0,30,96,3,"#62c640");
  for(let x=0;x<96;x+=5){px(c,x,33,2,1,"#62c640");px(c,x+2,30,1,1,"#3b8f24");px(c,(x*7)%96,36,1,1,"#6e4520")}
  // swing
  const t=reduce?0.3:((now/1000)%0.6)/0.6;            // one swing per 0.6s
  const ang=-3.4+Math.sin(t*Math.PI)*2.25;            // overhead -> strike the block
  if(!reduce&&SC.phase==="mine"&&t<SC.last){SC.hits++; if(SC.hits>=10){SC.phase="boom";SC.t0=now;
    SC.parts=Array.from({length:14},()=>({x:66,y:22,vx:(Math.random()-.5)*0.9,vy:-Math.random()*1.1-.2,c:Math.random()<.35?"#3ee0d0":(Math.random()<.5?"#8f8f8f":"#6e6e6e")}));
    SC.gem={y:20,vy:-1.2}}}
  SC.last=t;
  // block
  if(SC.phase==="mine"){
    const bx=58,by=14;
    px(c,bx,by,16,16,"#8f8f8f");
    [[1,2],[4,1],[9,3],[13,1],[2,8],[7,6],[12,7],[5,12],[10,11],[14,13],[1,14],[8,14],[3,5],[11,9]].forEach(([x,y])=>px(c,bx+x,by+y,2,1,"#767676"));
    [[6,0],[0,11],[15,5],[9,15],[14,10]].forEach(([x,y])=>px(c,bx+x,by+y,1,1,"#a8a8a8"));
    [[2,2],[10,4],[5,9],[12,11],[3,13]].forEach(([x,y])=>{px(c,bx+x,by+y,2,2,"#3ee0d0");px(c,bx+x,by+y,1,1,"#c9fffa");px(c,bx+x+1,by+y+1,1,1,"#1c9f93")});
    px(c,bx,by,16,1,"#a8a8a8");px(c,bx,by,1,16,"#a8a8a8");px(c,bx+15,by,1,16,"#5e5e5e");px(c,bx,by+15,16,1,"#5e5e5e");
    const stage=Math.min(4,Math.floor(SC.hits/2.5));
    const cr=[[7,7],[8,8],[6,9],[9,6],[5,5],[10,10],[4,11],[11,4],[3,7],[12,8],[7,2],[8,13],[2,3],[13,12],[6,12],[10,3]];
    for(let i=0;i<stage*4;i++) px(c,bx+cr[i][0],by+cr[i][1],1,1,"#2a2a2a");
  } else {
    const dt=(now-SC.t0)/16;
    SC.parts.forEach(p=>{const x=p.x+p.vx*dt,y=Math.min(29,p.y+p.vy*dt+0.04*dt*dt);px(c,x,y,2,2,p.c)});
    const g=SC.gem; const gy=Math.min(25,g.y+g.vy*dt+0.05*dt*dt);
    px(c,64,gy+1,5,2,"#3ee0d0");px(c,65,gy,3,1,"#a6fff6");px(c,65,gy+3,3,1,"#1c9f93");px(c,66,gy+4,1,1,"#1c9f93");
    if(now-SC.t0>1800){SC.phase="mine";SC.hits=0}
  }
  // miner (original design): cap, black hair, orange hoodie, green pants
  const mx=40,my=6;
  px(c,mx+1,my+22,3,2,"#2b2b2b");px(c,mx+6,my+22,3,2,"#2b2b2b");             // shoes
  px(c,mx+1,my+16,3,6,"#2f7d4a");px(c,mx+6,my+16,3,6,"#2f7d4a");             // legs
  px(c,mx,my+8,10,8,"#ff8a1f");px(c,mx+3,my+8,4,2,"#ffb366");px(c,mx+4,my+12,2,3,"#d96a08"); // hoodie
  px(c,mx+1,my,8,8,"#f1c27d");                                                // head
  px(c,mx+1,my,8,2,"#1d1d1d");px(c,mx+1,my+2,1,2,"#1d1d1d");                  // hair
  px(c,mx,my-2,9,2,"#d93b3b");px(c,mx+8,my-1,4,1,"#d93b3b");                  // cap + visor
  px(c,mx+6,my+3,1,2,"#1d1d1d");px(c,mx+4,my+6,3,1,"#c47a52");                // eye, mouth
  // arm + pickaxe rotating around shoulder
  const sx=mx+8,sy=my+10;
  c.save();c.translate(sx,sy);c.rotate(ang);
  px(c,-1,0,3,5,"#ff8a1f");px(c,-1,5,3,2,"#f1c27d");                          // arm + hand
  px(c,0,4,1,11,"#8a5a2c");                                                   // handle
  px(c,-4,13,9,2,"#9aa3ad");px(c,-5,14,2,1,"#6d757e");px(c,4,14,2,1,"#6d757e"); // head of pick
  c.restore();
}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
function sayP(t,lang){if(lang.startsWith("en")&&clip(t))return new Promise(res=>{const a=playClip(t);if(!a)return setTimeout(res,1200);let done=false;const fin=()=>{if(!done){done=true;res()}};a.onended=fin;a.onerror=fin;setTimeout(fin,6000)});
  return new Promise(res=>{if(!canSpeak())return setTimeout(res,1400);try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang;
  if(lang.startsWith("en")){if(voice)u.voice=voice;u.rate=.8}else{const rv=speechSynthesis.getVoices().find(v=>/^ru/i.test(v.lang));if(rv)u.voice=rv;u.rate=1}

// ---------- Quiz engine ----------
function buildQuiz(qid){
  const q=questList().find(x=>x.id===qid);
  let pool=q.hw?hwWords():q.weak?ALL_WORDS.filter(w=>weak(w.en)&&inUnits(w,q.units)):ALL_WORDS.filter(w=>inUnits(w,q.units));
  if(!pool.length) return null;
  const units=(q.weak||q.hw)?[...new Set(pool.flatMap(w=>w.us))]:q.units;
  const sents=SENTENCES.filter(s=>units.includes(s.u));
  const letters=[...new Set(UNITS.filter(u=>units.includes(u.id)).flatMap(u=>u.letters))];
  const items=[]; const order=shuffle(pool).map(w=>({w,k:(weak(w.en)?0:1e13)+(wstat(w.en).seen||0)+Math.random()*6e4})).sort((a,b)=>a.k-b.k).map(x=>x.w); let i=0;
  const types=q.tr?Array(pool.length).fill("meaning"):q.hw?Array(pool.length).fill("say"):q.hint?Array(10).fill("hint"):q.speak?Array(10).fill("say"):["write","say","dict","read","pairs","first","write","sentence","say","write"];
  for(const t of types){
    if(t==="sentence"&&sents.length){const s=pick(sents,1)[0];const wrong=pick(SENTENCES.filter(x=>x!==s),3).map(x=>x.ru);
      items.push({type:"sentence",word:s.en,answer:s.ru,opts:shuffle([s.ru,...wrong])});continue}
    const w=order[i++%order.length];
    const others=ALL_WORDS.filter(x=>x.en!==w.en);
    const near=others.filter(x=>inUnits(x,units)); const src=near.length>=3?near:others;
    if(t==="hint"){const parts=w.en.split(" ").map(pt=>{const n=pt.replace(/[^a-z]/gi,"").length<=3?1:2;return {pre:pt.slice(0,n),rest:pt.slice(n)}});items.push({type:"hint",word:w.en,ru:w.ru,answer:w.en,parts})}
    else if(t==="write") items.push({type:"write",word:w.en,ru:w.ru,answer:w.en});
    else if(t==="say") items.push({type:"say",word:w.en,ru:w.ru,answer:w.en});
    else if(t==="dict") items.push(canSpeak()?{type:"dict",word:w.en,answer:w.en}:{type:"write",word:w.en,ru:w.ru,answer:w.en});
    else if(t==="listen"||t==="sentence") items.push({type:"listen",word:w.en,answer:w.en,opts:shuffle([w.en,...pick(src,3).map(x=>x.en)])});
    else if(t==="read") items.push({type:"read",word:w.en,answer:w.ru,opts:shuffle([w.ru,...pick(src,3).map(x=>x.ru)])});
    else if(t==="pairs"){ if(canSpeak()){const g=pick(PAIRS,1)[0];const a=pick(g,1)[0];items.push({type:"pairs",word:a,answer:a,opts:shuffle(g)})}
      else items.push({type:"read",word:w.en,answer:w.ru,opts:shuffle([w.ru,...pick(src,3).map(x=>x.ru)])}) }
    else if(t==="meaning") items.push({type:"meaning",word:w.en,answer:w.ru,opts:shuffle([w.ru,...pick(src,3).map(x=>x.ru)])});
    else if(t==="spell") items.push({type:"spell",word:w.en,ru:w.ru,letters:shuffle(w.en.toLowerCase().split(""))});
    else if(t==="first"){const lw=w.en.toLowerCase();const ans=["sp","st"].find(b=>lw.startsWith(b))||(lw.startsWith("fr")?"f":lw[0]);
      const pool2=[...new Set([...letters,"c","b","m","h","p","r","f","n","s","d","g","t","l"])].filter(x=>x!==ans);
      items.push({type:"first",word:w.en,answer:ans,opts:shuffle([ans,...pick(pool2,3)])})}
  }
  return {qid,name:q.name,double:!!q.weak,items,idx:0,score:0,pts:0,typed:"",selfN:0,selfOk:0,selfMist:[],soundMist:[],revealed:false,answered:false,built:[],used:[],mist:[]};
}

  if(canSpeak()&&(!ok||it.type==="read")) say(word);

  v.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>{const d=day();if(d.t[b.dataset.task])return;d.t[b.dataset.task]=new Date().toTimeString().slice(0,5);earn(PRICE.task,"отмечено");checkDayBonus();save();render()});
  v.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});
  v.querySelectorAll("[data-lr-start]").forEach(b=>b.onclick=()=>{const lw=lrWords();lr={words:lw.w,idx:0,running:true,phase:"ru"};tab="quests";render();lrRun()});
  const lt=v.querySelector("[data-lr-toggle]"); if(lt) lt.onclick=()=>{if(lr.running){lr.running=false;lrStop();render()}else{lr.running=true;render();lrRun()}};
  const lnx=v.querySelector("[data-lr-next]"); if(lnx) lnx.onclick=()=>{lrStop();lr.idx=Math.min(lr.idx+1,lr.words.length);lr.phase="ru";if(lr.idx>=lr.words.length){lr.running=true;lrRun();return}render();if(lr.running)lrRun()};
  const lpv=v.querySelector("[data-lr-prev]"); if(lpv) lpv.onclick=()=>{lrStop();lr.idx=Math.max(0,lr.idx-1);lr.phase="ru";render();if(lr.running)lrRun()};
  v.querySelectorAll("[data-lr-exit]").forEach(b=>b.onclick=()=>{lrStop();lr=null;render()});
  const lag=v.querySelector("[data-lr-again]"); if(lag) lag.onclick=()=>{lr={words:shuffle(lr.words),idx:0,running:true,phase:"ru"};render();lrRun()};
  v.querySelectorAll("[data-quest-go]").forEach(b=>b.onclick=()=>{tab="quests";quiz=buildQuiz(b.dataset.questGo);render();autoSay()});
  v.querySelectorAll("[data-quest]").forEach(b=>b.onclick=()=>{quiz=buildQuiz(b.dataset.quest);if(!quiz)return toast("Здесь пока нет слов");render();autoSay()});
  v.querySelectorAll("[data-prog]").forEach(b=>b.onclick=()=>{qprog=b.dataset.prog;wf="all";render()});
  v.querySelectorAll("[data-wf]").forEach(b=>b.onclick=()=>{wf=(wf===b.dataset.wf?"all":b.dataset.wf);render()});
  v.querySelectorAll("[data-flip]").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("open")||b.classList.contains("wait")){clearTimeout(b._t);b.classList.remove("open","wait");return}
    say(b.dataset.flip);b.classList.add("wait");b._t=setTimeout(()=>{b.classList.remove("wait");b.classList.add("open")},2000)});
  v.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  v.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{const it=quiz.items[quiz.idx];quiz.chosen=b.dataset.opt;answer(b.dataset.opt===it.answer,it.type==="sentence"?it.word:it.word)});
  v.querySelectorAll("[data-tile]").forEach(b=>b.onclick=()=>{const it=quiz.items[quiz.idx];const j=+b.dataset.tile;quiz.used.push(j);quiz.built.push(j);
    if(quiz.built.length===it.letters.length){const got=quiz.built.map(x=>it.letters[x]).join("");answer(got===it.word.toLowerCase(),it.word)}else render()});
  const rv=v.querySelector("[data-reveal]"); if(rv) rv.onclick=()=>{quiz.revealed=true;render();say(quiz.items[quiz.idx].word)};
  v.querySelectorAll("[data-self]").forEach(b=>b.onclick=()=>{const it=quiz.items[quiz.idx];const ok=b.dataset.self==="1";
    quiz.answered=true;quiz.selfN++;if(ok){quiz.selfOk++;quiz.pts+=quiz.qid==="hw"?PRICE.correct:PRICE.self;if(quiz.qid==="hw")mark(it.word,true)}else{quiz.selfMist.push(it.word);mark(it.word,false)}
    quiz.fb=ok?"ok":"bad";quiz.fbText=ok?"Молодец! Засчитано по честному слову.":"Ничего, послушай ещё раз и повтори вслух.";render()});
  const ti=v.querySelector("#typed"), ck=v.querySelector("[data-check]");
  if(ti&&!ti.classList.contains("tp")){ti.oninput=()=>quiz.typed=ti.value;ti.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();ck&&ck.click()}}}
  const tps=[...v.querySelectorAll(".tp")];
  tps.forEach((inp,k)=>{inp.oninput=()=>{quiz.typedParts=tps.map(x=>x.value)};inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(k<tps.length-1)tps[k+1].focus();else ck&&ck.click()}}});
  if(ck) ck.onclick=()=>{const it=quiz.items[quiz.idx];
    if(it.type==="hint"){const vals=tps.map(x=>x.value);if(vals.some(x=>!norm(x)))return toast("Допиши все слова");quiz.typedParts=vals;
      const full=it.parts.map((pt,k)=>pt.pre+vals[k]).join(" ");return answer(norm(full)===norm(it.answer),it.word,false)}
    const val=norm(ti.value);if(!val)return toast("Сначала напиши слово");quiz.typed=ti.value;answer(val===norm(it.answer),it.word,true)};
  v.querySelectorAll("details.more").forEach(d=>d.ontoggle=()=>{d.open?openD.add(d.id):openD.delete(d.id)});
  v.querySelectorAll("[data-exam-ru]").forEach(b=>b.onclick=()=>{tab="parent";exam=buildExam("ru");render()});
  const es=v.querySelector("[data-exam-start]"); if(es) es.onclick=()=>{exam=buildExam();if(!exam.items.length){exam=null;return toast("Пока нет слов для экзамена")}render()};
  v.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{const w=exam.items[exam.idx];const ok=b.dataset.ex==="1";if(ok)exam.ok++;else exam.mist.push(w.en);mark(w.en,ok,true);
    if(exam.idx+1>=exam.items.length)return finishExam();exam.idx++;exam.show=false;render()});
  const esh=v.querySelector("[data-exam-show]"); if(esh) esh.onclick=()=>{exam.show=true;render();say(exam.items[exam.idx].en)};
  const eq=v.querySelector("[data-exam-quit]"); if(eq) eq.onclick=()=>{exam=null;render()};
  const ec=v.querySelector("[data-exam-close]"); if(ec) ec.onclick=()=>{exam=null;render()};
  const dk=v.querySelector("[data-dunno]"); if(dk) dk.onclick=()=>{const it=quiz.items[quiz.idx];
    if(it.type==="say"){quiz.revealed=true;quiz.answered=true;quiz.selfN++;quiz.selfMist.push(it.word);mark(it.word,false);quiz.fb="bad";say(it.word)}
    else{quiz.typed="";quiz.chosen=null;answer(false,it.word,it.type==="write"||it.type==="dict")}
    const isW=ALL_WORDS.find(w=>w.en===it.word);
    quiz.fbText=`Запомни: ${it.word.replace(/\.$/,"")}${isW?" — "+isW.ru:(it.type==="sentence"?" — "+it.answer.replace(/\.$/,""):"")}.${isW?" Слово попадёт в «Охоту на ошибки».":""}`;render()};
  const u=v.querySelector("[data-undo]"); if(u) u.onclick=()=>{quiz.built.pop();quiz.used.pop();render()};
  const nx=v.querySelector("[data-next]"); if(nx) nx.onclick=()=>{if(quiz.idx+1>=quiz.items.length)return finishQuiz();quiz.idx++;Object.assign(quiz,{answered:false,built:[],used:[],fb:"",fbText:"",chosen:null,typed:"",typedParts:[],revealed:false});render();autoSay()};
  const qt=v.querySelector("[data-quit]"); if(qt) qt.onclick=()=>{quiz=null;save();render()};
  v.querySelectorAll("[data-bank]").forEach(b=>b.onclick=()=>{const n=Math.floor(+$("#bankAmt").value);bankAmt="";
    if(!(n>0))return toast("Впиши число");
    if(b.dataset.bank==="in"){if(n>S.coins)return toast("Столько нет в кармане");S.coins-=n;S.bank+=n;toast(`В банке ${S.bank}`)}
    else{if(n>S.bank)return toast("Столько нет в банке");S.bank-=n;S.coins+=n;toast(`В кармане ${S.coins}`)}
    save();render()});
  v.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{const r=S.rewards.find(x=>x.id===b.dataset.buy);if(!r||S.coins<r.price)return;if(r.needsDay&&!dayFull(day()))return toast("Сначала выполни весь план дня");
    S.coins-=r.price;S.purchases.push({name:r.name,price:r.price,at:new Date().toLocaleString("ru-RU",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}),given:false});toast(`Куплено: ${r.name}. Покажи маме!`);save();render()});
  const pin=v.querySelector("[data-pin]"); if(pin) pin.onclick=()=>{if($("#pinIn").value===S.pin){parentOpen=true;render()}else toast("Неверный код")};
  v.querySelectorAll("[data-give]").forEach(b=>b.onclick=()=>{const p=S.purchases[+b.dataset.give];p.given=!p.given;save();render()});
  const readR=()=>S.rewards.map((r,i)=>({...r,name:($("#rn"+i)?.value||r.name).trim()||r.name,price:Math.max(1,Math.floor(+($("#rp"+i)?.value)||r.price)),needsDay:$("#rd"+i)?!!$("#rd"+i).checked:!!r.needsDay}));
  v.querySelectorAll("[data-delr]").forEach(b=>b.onclick=()=>{S.rewards=readR();S.rewards.splice(+b.dataset.delr,1);save();render()});
  const ar=v.querySelector("[data-addr]"); if(ar) ar.onclick=()=>{S.rewards=readR();S.rewards.push({id:"r"+Date.now(),name:"Новая награда",price:50});render()};
  const sr=v.querySelector("[data-saver]"); if(sr) sr.onclick=()=>{S.rewards=readR();save();toast("Награды сохранены")};
  const sp=v.querySelector("[data-setpin]"); if(sp) sp.onclick=()=>{const p=$("#pinSet").value.trim();if(!/^\d{4,6}$/.test(p))return toast("Код: 4–6 цифр");S.pin=p;parentOpen=true;save();toast("Код сохранён");render()};
  const lk=v.querySelector("[data-lock]"); if(lk) lk.onclick=()=>{parentOpen=false;tab="today";render()};
  const ba=v.querySelector("#bankAmt"); if(ba) ba.oninput=()=>bankAmt=ba.value;
}
function autoSay(){const it=quiz&&quiz.items[quiz.idx];if(it&&["listen","first","sentence","dict","pairs"].includes(it.type))setTimeout(()=>say(it.word),250);
  const inp=document.getElementById("typed");if(inp&&!quiz.answered)setTimeout(()=>{try{inp.focus()}catch(e){}},50)}
const norm=s=>String(s).toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();
document.getElementById("logoutBtn").onclick=()=>logout();
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{if((quiz||lr)&&b.dataset.tab!=="quests"){tab="quests";render();return toast("Сначала закончи квест или нажми «Выйти»")}tab=b.dataset.tab;if(tab!=="parent")parentOpen=false;render()});

// ---------- Boot ----------
function normalize(x){x=JSON.parse(JSON.stringify(x||{}));const b=blank();const s={...b,...x};if(!Array.isArray(s.rewards)||!s.rewards.length)s.rewards=DEFAULT_REWARDS;s.days=s.days||{};s.words=s.words||{};s.purchases=s.purchases||[];return s}
function afterLoad(){const ch=applyInterest();day();render();if(ch)save()}
const fmtDate=u=>u?u.split("-").reverse().join("."):"";
function showApp(on){document.querySelector(".tabs").hidden=!on;document.getElementById("view").hidden=!on;document.querySelector(".wallet").hidden=!on;document.getElementById("gate").hidden=on}
function loginScreen(msg,code){showApp(false);const g=document.getElementById("gate");
  g.innerHTML=`<section class="card block" style="max-width:520px;margin:20px auto"><h2>Вход на остров</h2>
   <p class="small">Введи свой код. С ним можно заниматься на компьютере, планшете и телефоне, прогресс везде один.</p>
   <form id="lf" class="row"><input id="code" value="${esc(code||"")}" placeholder="ABC-2345" autocomplete="off" autocapitalize="characters" spellcheck="false" style="flex:1 1 180px;font-size:1.3rem;text-transform:uppercase;letter-spacing:.1em" aria-label="Код"><button class="btn" type="submit">Войти</button></form>
   ${msg?`<p class="feedback bad" style="text-align:left">${msg}</p>`:""}</section>`;
  document.getElementById("lf").onsubmit=e=>{e.preventDefault();const c=document.getElementById("code").value.trim().toUpperCase();if(c)doLogin(c)};
  setStatus("")}
function gate(r,code){
  const m={notfound:"Такого кода нет. Проверь буквы: они латинские, например ABC-2345.",
    expired:`Доступ закончился${r.until?" "+fmtDate(r.until):""}. Прогресс сохранён. ${esc(CONTACT)}.`,
    blocked:`Этот код отключён. ${esc(CONTACT)}.`,
    devices:`Код уже используется на ${r.max||3} устройствах. ${esc(CONTACT)}.`,
    device:"Это устройство не привязано к коду. Войди заново.",
    network:"Нет связи с сервером. Проверь интернет и попробуй ещё раз.",
    server:"Сервер не ответил. Попробуй ещё раз через минуту."}[r.error]||"Не получилось войти. Попробуй ещё раз.";
  ACC=null;loginScreen(m,code)}
async function doLogin(code,auto){
  showApp(false);document.getElementById("gate").innerHTML='<section class="card block" style="max-width:520px;margin:20px auto"><h2>Загружаю остров…</h2></section>';
  let r;
  try{r=await (await fetch(API_URL+"?action=login&app="+APP+"&code="+encodeURIComponent(code)+"&device="+encodeURIComponent(DEV))).json()}
  catch(e){
    if(auto){ACC={code,offline:true};const raw=lsGet(lsKey());if(raw){try{S=normalize(JSON.parse(raw))}catch(_){}}showApp(true);afterLoad();setStatus("Нет интернета: занимаемся, прогресс сохранится позже");return}
    return gate({error:"network"},code)}
  if(!r||!r.ok){if(r&&r.error!=="network")lsDel("wq-code-island");return gate(r||{error:"server"},code)}
  ACC={code:r.code||code,name:r.name||"",until:r.until,daysLeft:r.daysLeft};
  lsSet("wq-code-island",ACC.code);
  let st=null;if(r.progress){try{st=JSON.parse(r.progress)}catch(e){}}
  if(!st){const raw=lsGet(lsKey())||lsGet(LS0);if(raw){try{st=JSON.parse(raw)}catch(e){}}}
  S=normalize(st||blank());
  showApp(true);afterLoad();
  if(!r.progress)save();
  setStatus("Прогресс общий для всех устройств · код "+ACC.code+(ACC.daysLeft!=null&&ACC.daysLeft<=5?" · доступ до "+fmtDate(ACC.until):""));
}
function logout(){clearTimeout(saveT);pushSave();lsDel("wq-code-island");ACC=null;S=blank();loginScreen("")}
{const c=lsGet("wq-code-island");c?doLogin(c,true):loginScreen("")}
</script>

</body></html>
